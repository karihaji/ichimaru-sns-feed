name: Update X feed

on:
  schedule:
    - cron: "31 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check X API credential
        id: credential
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ -n "$X_BEARER_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::X_BEARER_TOKEN is not configured; keeping the existing X data."
          fi
      - name: Fetch List posts
        if: steps.credential.outputs.available == 'true'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run update:x
      - name: Validate data
        if: steps.credential.outputs.available == 'true'
        run: npm run validate
      - name: Commit updated data
        if: steps.credential.outputs.available == 'true'
        run: |
          if git diff --quiet -- public/data/x.json; then
            echo "No X data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/x.json
          git commit -m "chore: update X feed"
          git push
