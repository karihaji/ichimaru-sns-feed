name: Update YouTube feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-youtube
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch public YouTube feed
        run: npm run update:youtube
      - name: Validate data
        run: npm run validate
      - name: Commit changed data
        run: |
          if git diff --quiet -- public/data/youtube.json; then
            echo "No YouTube changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/youtube.json
          git commit -m "chore: update YouTube feed"
          git push
